[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanroom"
version = "0.3.0"
description = "Clean Room Coding: reproducible, auditable clean-room software reimplementation, provenance and licensing assurance platform."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Clean Room Coding Contributors" }]
keywords = ["clean-room", "licensing", "provenance", "sbom", "compliance", "reimplementation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "rich>=13.7",
  "license-expression>=30.4",
  "ast-grep-py>=0.45",
  "spdx-tools>=0.8.5",
  "cyclonedx-python-lib>=11.12",
  "tomli>=2.0.1; python_version<\"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "reuse[charset-normalizer]>=4.0", "fpdf2>=2.8", "huggingface_hub>=0.24", "anthropic>=1.0"]
pdf = ["fpdf2>=2.8"]
ai = ["huggingface_hub>=0.24"]
orchestrate = ["anthropic>=1.0"]

[project.scripts]
cleanroom = "cleanroom.cli:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
