# Licence policy pack: NASA-1.3 (NASA Open Source Agreement v1.3)
# Verified against the actual licence text (fetched via OSI's own mirror,
# https://opensource.org/license/NASA-1.3, and directly text-searched
# rather than summarised from an excerpt) and cross-checked against
# SPDX's own license-list-data (`isOsiApproved: true`, `isFsfLibre:
# false`).
#
# NOT a public-domain instrument, despite covering US federal government
# software -- see NIST-PD.yml/NTIA-PD.yml for that different case. The
# licence's own copyright-notice template has three variants (applicable
# notice / contractor-created-with-assigned-rights / civil-servant-only
# with no copyright claimed), confirming it exists precisely because NASA
# software is often NOT purely civil-servant-authored (much is created by
# contractors, e.g. JPL/Caltech), so copyright CAN subsist in it under
# ordinary US law -- unlike NIST-PD/NTIA-PD's pure civil-servant case,
# where 17 U.S.C. Sec. 105 already puts the work in the public domain and
# no licence is legally required at all.

spdx_id: NASA-1.3
family: copyleft
osi_approved: true
fsf_libre: false

# The FSF's specific published rationale for excluding NASA-1.3 from its
# free-software list was not independently re-verified against gnu.org's
# own license-list page in this pass (that page could not be fetched in
# this environment); SPDX's own license-list-data confirms `isFsfLibre:
# false` as a fact, and this pack's own reading of the licence text (see
# key_obligations' indemnification clause below) is consistent with the
# commonly-cited reason, but that specific FSF rationale text itself is
# not independently confirmed here.
copyleft: strong

summary: >
  A real, substantive open source licence (not a bare public-domain
  notice) used for software originally released by a US Government
  agency (NASA). Grants a non-exclusive, worldwide, royalty-free licence
  to use, distribute, reproduce, modify and redistribute the Subject
  Software, plus an express patent grant under Covered Patents.
  Distribution or redistribution must be made under this same Agreement
  (a real reciprocal/copyleft obligation on the covered software itself),
  and a Recipient forming a Larger Work by combining the Subject Software
  with separately-governed software must ensure the Subject Software
  portions remain subject to this Agreement.

key_obligations:
  - "Include a copy of this Agreement with every copy of the Subject Software distributed or redistributed."
  - "If distributing/redistributing in a form other than source code, also make the source code freely available and state how to obtain it through a medium customarily used for software exchange."
  - "Ensure the applicable copyright notice (the licence's own template has separate wording for a Government-agency notice, a contractor-created-with-assigned-rights notice, and a civil-servant-only 'no copyright is claimed' notice) appears prominently."
  - "Characterise any alteration as a Modification, identify the Contributor as its originator (e.g. via a change-log file), and note this consent to the Modification characterisation cannot later be revoked."
  - "A Recipient who offers a warranty, support, or additional liability/indemnity obligation to others does so alone -- and must indemnify the Government Agency and every other Recipient for any liability incurred as a result of that Recipient's own warranty/support/indemnity offer."

distribution_triggers: [source, binary, library, container]
network_use_triggers_obligations: false  # not addressed by the licence text located in this pass
patent_grant: true
patent_retaliation_clause: false  # not confirmed present in the sections read this pass
trademark_grant: false
reverse_engineering_restriction: false  # the licence text imposes no reverse-engineering/study restriction

clean_room_relevance: >
  Reference material carrying this licence should NOT be assumed to be
  public domain just because it originates with a US Government agency
  -- unlike a pure civil-servant work (see NIST-PD.yml/NTIA-PD.yml), NASA
  specifically uses this licence for software where real copyright can
  subsist (contractor-authored, or otherwise not purely a Sec. 105 civil-
  servant work), and its redistribution/source-disclosure obligations
  apply to that copyrighted software exactly like any other copyleft
  licence's obligations would. The indemnification clause above is a real,
  distinctive term with no equivalent in this project's other copyleft
  packs (GPL-3.0-only/AGPL-3.0-only/EUPL-1.2) -- flag it separately in
  review rather than assuming "it's a US Government licence" implies
  weaker obligations.

structured_issue_prompts:
  - "Was this specific Subject Software actually created by a civil servant acting within the scope of employment (making it Sec. 105 public domain regardless of this licence's text), or by a contractor/mixed authorship (making the licence's obligations the operative fact)?"
  - "If distributing in non-source form, has the source code actually been made freely available with instructions on how to obtain it, as Obligation A.2 requires?"
  - "If this Recipient is offering any warranty, support, or indemnity of its own, has the resulting indemnification obligation toward the Government Agency and other Recipients been accounted for?"
  - "Has the reference implementation been observed only to extract observable requirements, never source implementation detail, in the handoff bundle (Part XVI)?"

uncertainty_notes: >
  Whether a specific NASA-released codebase is actually governed by this
  licence (as opposed to being pure Sec. 105 public domain with no
  licence needed at all) depends on facts about its actual authorship
  this tool cannot determine from the licence text alone -- that
  determination is what `licence_findings`'s declared/concluded licence
  is for, not something this pack infers. `network_use_triggers_obligations`
  and `patent_retaliation_clause` reflect the sections of the licence text
  actually located and searched in this pass, not an exhaustive re-read of
  every clause.
